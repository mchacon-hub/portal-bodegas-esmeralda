<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#0F3D2E">
<title>Bodegas Esmeralda — Portal de Producción</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" href="favicon.ico">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --verde-oscuro:#0c3527;
    --verde-botella:#154a37;
    --verde-musgo:#5c8a6c;
    --verde-brillo:#8fbf9f;
    --dorado:#c9a227;
    --dorado-claro:#e8c468;
    --crema:#f4efe2;
    --crema-suave:#ece4d1;
    --tinta:#141a15;
    --sombra: 0 18px 40px -18px rgba(0,0,0,0.55);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter', sans-serif;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(143,191,159,0.18), transparent 60%),
      linear-gradient(180deg, var(--verde-oscuro) 0%, #0a2b20 55%, #081f18 100%);
    color:var(--crema);
    min-height:100%;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; border:none; background:none; cursor:pointer; color:inherit;}

  /* ---------- Header ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px clamp(20px,5vw,64px);
    border-bottom:1px solid rgba(232,196,104,0.16);
  }
  .marca{display:flex; align-items:center; gap:14px;}
  .monograma{
    width:42px; height:42px; border-radius:50%;
    background:linear-gradient(135deg,var(--dorado-claro),var(--dorado) 60%,#8a6d17);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:600; font-size:17px; color:var(--verde-oscuro);
    box-shadow:0 4px 14px rgba(201,162,39,0.35);
    flex-shrink:0;
  }
  .marca-texto{line-height:1.15;}
  .marca-texto .nombre{
    font-family:'Fraunces',serif; font-weight:600; letter-spacing:0.04em;
    font-size:15px; text-transform:uppercase; color:var(--crema);
  }
  .marca-texto .sub{
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--verde-brillo);
  }
  .fecha-header{
    font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--verde-brillo);
    letter-spacing:0.03em; display:none;
  }
  @media(min-width:700px){ .fecha-header{display:block;} }

  /* ---------- Hero ---------- */
  .hero{
    position:relative; overflow:hidden;
    padding:clamp(56px,10vw,96px) clamp(20px,6vw,64px) clamp(48px,7vw,72px);
    text-align:center;
    display:flex; flex-direction:column; align-items:center;
  }
  .filas-vina{
    position:absolute; inset:0; z-index:0; opacity:0.35; pointer-events:none;
  }
  .sello{
    position:relative; z-index:1;
    width:78px; height:78px; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #f3d783, var(--dorado) 46%, #7d611a 100%);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:700; font-size:28px; color:var(--verde-oscuro);
    box-shadow:0 12px 30px -8px rgba(201,162,39,0.55), inset 0 0 0 3px rgba(20,26,21,0.15);
    margin-bottom:26px;
  }
  .hero h1{
    position:relative; z-index:1;
    font-family:'Fraunces',serif; font-weight:600;
    font-size:clamp(30px,5.4vw,54px);
    line-height:1.08;
    color:var(--crema);
  }
  .hero h1 em{
    font-style:normal; color:var(--dorado-claro);
  }
  .hero p{
    position:relative; z-index:1;
    margin-top:16px; max-width:520px;
    font-size:clamp(14px,1.7vw,16px); color:var(--verde-brillo); line-height:1.6;
  }

  /* ---------- Sectores ---------- */
  main{
    max-width:920px; margin:0 auto;
    padding:0 clamp(16px,5vw,32px) 80px;
    display:flex; flex-direction:column; gap:18px;
  }
  .sector{
    background:linear-gradient(180deg, rgba(244,239,226,0.06), rgba(244,239,226,0.03));
    border:1px solid rgba(232,196,104,0.18);
    border-radius:16px;
    overflow:hidden;
    box-shadow:var(--sombra);
    transition:border-color .25s ease;
  }
  .sector[open]{ border-color:rgba(232,196,104,0.4); }
  .sector-cabecera{
    width:100%;
    display:flex; align-items:center; gap:16px;
    padding:20px 22px;
    text-align:left;
  }
  .sector-icono{
    width:46px; height:46px; flex-shrink:0; border-radius:12px;
    background:rgba(232,196,104,0.12);
    display:flex; align-items:center; justify-content:center;
  }
  .sector-icono svg{width:24px; height:24px;}
  .sector-titulo{flex:1;}
  .sector-titulo .num{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.12em;
    color:var(--dorado-claro); display:block; margin-bottom:2px;
  }
  .sector-titulo .nombre-sector{
    font-family:'Fraunces',serif; font-weight:600; font-size:clamp(18px,2.6vw,22px);
    color:var(--crema);
  }
  .sector-titulo .conteo{
    font-size:12px; color:var(--verde-brillo); margin-top:2px;
  }
  .flecha{
    width:22px; height:22px; flex-shrink:0;
    transition:transform .3s ease;
    color:var(--dorado-claro);
  }
  .sector[open] .flecha{ transform:rotate(180deg); }

  .sector-cuerpo{
    padding:0 22px 22px;
    display:grid; gap:10px;
  }
  @media(min-width:640px){
    .sector-cuerpo{ grid-template-columns:1fr 1fr; }
  }

  .enlace{
    display:flex; align-items:center; gap:12px;
    padding:14px 16px;
    background:rgba(20,26,21,0.35);
    border:1px solid rgba(244,239,226,0.1);
    border-radius:11px;
    min-height:52px;
    transition:background .2s ease, border-color .2s ease, transform .15s ease;
  }
  .enlace:hover{
    background:rgba(232,196,104,0.1);
    border-color:rgba(232,196,104,0.4);
    transform:translateY(-1px);
  }
  .enlace .punto{
    width:7px; height:7px; border-radius:50%; background:var(--dorado-claro); flex-shrink:0;
  }
  .enlace span.txt{ font-size:14.5px; font-weight:500; color:var(--crema); }

  .enlace.pendiente{
    opacity:0.55; cursor:default; border-style:dashed;
  }
  .enlace.pendiente:hover{ transform:none; background:rgba(20,26,21,0.35); border-color:rgba(244,239,226,0.1); }
  .enlace.pendiente .punto{ background:rgba(244,239,226,0.4); }
  .enlace.pendiente .etiqueta-pendiente{
    margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:10px;
    letter-spacing:0.06em; text-transform:uppercase; color:var(--verde-brillo);
    background:rgba(92,138,108,0.25); padding:3px 8px; border-radius:20px; flex-shrink:0;
  }

  footer{
    text-align:center; padding:28px 20px 40px;
    font-size:11.5px; color:rgba(244,239,226,0.35);
    letter-spacing:0.04em;
  }
</style>
</head>
<body>

<header>
  <div class="marca">
    <div class="monograma">BE</div>
    <div class="marca-texto">
      <div class="nombre">Bodegas Esmeralda</div>
      <div class="sub">Portal de producción</div>
    </div>
  </div>
  <div class="fecha-header" id="fecha-header"></div>
</header>

<section class="hero">
  <svg class="filas-vina" viewBox="0 0 800 260" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="lineaDorada" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e8c468" stop-opacity="0"/>
        <stop offset="100%" stop-color="#e8c468" stop-opacity="0.55"/>
      </linearGradient>
    </defs>
    <g stroke="url(#lineaDorada)" stroke-width="1.2" fill="none">
      <path d="M -50 260 L 400 -20"/>
      <path d="M 40 260 L 400 30"/>
      <path d="M 140 260 L 400 78"/>
      <path d="M 250 260 L 400 118"/>
      <path d="M 400 260 L 400 150"/>
      <path d="M 550 260 L 400 118"/>
      <path d="M 660 260 L 400 78"/>
      <path d="M 760 260 L 400 30"/>
      <path d="M 850 260 L 400 -20"/>
    </g>
  </svg>
  <div class="sello">BE</div>
  <h1>Bienvenidos a<br><em>Bodegas Esmeralda</em></h1>
  <p>Accesos directos a producción, insumos y calidad de proceso. Tocá un sector para ver sus enlaces.</p>
</section>

<main id="sectores"></main>

<footer>Bodegas Esmeralda · Uso interno · Vista Flores, Tunuyán</footer>

<script>
const iconos = {
  produccion: `<svg viewBox="0 0 24 24" fill="none" stroke="#e8c468" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="2.6"/><circle cx="15" cy="7" r="2.6"/><circle cx="12" cy="12" r="2.6"/><circle cx="9" cy="17" r="2.6"/><circle cx="15" cy="17" r="2.6"/></svg>`,
  insumos: `<svg viewBox="0 0 24 24" fill="none" stroke="#e8c468" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>`,
  calidad: `<svg viewBox="0 0 24 24" fill="none" stroke="#e8c468" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6v4l4 8a2 2 0 0 1-1.8 3H6.8A2 2 0 0 1 5 15l4-8V3z"/><path d="M8 14h8"/></svg>`
};

const data = [
  {
    id: "produccion",
    titulo: "Producción",
    icono: iconos.produccion,
    enlaces: [
      { texto: "Programa de Producción VF", url: "https://docs.google.com/spreadsheets/d/1durpzTPpruCm2gdtbvjj5GjCk8m3asc6CZcjCKvQxsc/edit?gid=958232884#gid=958232884" }
    ]
  },
  {
    id: "insumos",
    titulo: "Sector Insumos",
    icono: iconos.insumos,
    enlaces: [
      { texto: "Stock de Insumos por Sistema", url: null },
      { texto: "Stock de Insumos Excel", url: null },
      { texto: "Pendientes de Entregas VF", url: null },
      { texto: "Análisis de Necesidad de Compra", url: null },
      { texto: "Consulta de OC", url: null }
    ]
  },
  {
    id: "calidad",
    titulo: "Calidad Proceso",
    icono: iconos.calidad,
    enlaces: [
      { texto: "Performance", url: null }
    ]
  }
];

const cont = document.getElementById("sectores");

data.forEach((sector, i) => {
  const det = document.createElement("details");
  det.className = "sector";
  if (i === 0) det.open = true;

  const num = String(i + 1).padStart(2, "0");

  det.innerHTML = `
    <summary class="sector-cabecera">
      <div class="sector-icono">${sector.icono}</div>
      <div class="sector-titulo">
        <span class="num">SECTOR ${num}</span>
        <div class="nombre-sector">${sector.titulo}</div>
        <div class="conteo">${sector.enlaces.length} enlace${sector.enlaces.length > 1 ? "s" : ""}</div>
      </div>
      <svg class="flecha" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </summary>
    <div class="sector-cuerpo">
      ${sector.enlaces.map(en => {
        if (en.url) {
          return `<a class="enlace" href="${en.url}" target="_blank" rel="noopener">
            <span class="punto"></span><span class="txt">${en.texto}</span>
          </a>`;
        }
        return `<div class="enlace pendiente">
          <span class="punto"></span><span class="txt">${en.texto}</span>
          <span class="etiqueta-pendiente">falta enlace</span>
        </div>`;
      }).join("")}
    </div>
  `;
  cont.appendChild(det);
});

const fecha = new Date();
document.getElementById("fecha-header").textContent =
  fecha.toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" });
</script>

</body>
</html>
